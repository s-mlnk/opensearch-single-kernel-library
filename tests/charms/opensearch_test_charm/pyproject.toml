[tool.poetry]
package-mode = false
requires-poetry = ">=2.0.0"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[tool.poetry.dependencies]
python = "^3.10"
ops = "^2.22.0"
tenacity = "^9.1.2"
boto3 = "^1.38.36"
overrides = "^7.7.0"
requests = "2.32.4"
# Official name: ruamel.yaml, but due to Poetry GH#109 - replace dots with dashes
ruamel-yaml = "0.18.14"
shortuuid = "1.0.13"
pydantic = "^1.10.17, <2"
cryptography = "^45.0.4"
jsonschema = "^4.24.0"
data-platform-helpers = "^0.1.4"
poetry-core = "<2.0.0"
opensearch-single-kernel-library = {path = "opensearch_single_kernel"}


[tool.poetry.group.charm-libs.dependencies]
# data_platform_libs/v0/data_interfaces.py
ops = "^2.22.0"
# data_platform_libs/v0/upgrade.py
# grafana_agent/v0/cos_agent.py requires pydantic <2
pydantic = "^1.10.17, <2"
# tls_certificates_interface/v3/tls_certificates.py
cryptography = "^45.0.4"
jsonschema = "^4.24.0"
# grafana_agent/v0/cos_agent.py
cosl = "^1.0.0"
bcrypt = "^4.3.0"


[build-system]
build-backend = "poetry.core.masonry.api"
